[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "plaude-local"
version = "0.1.0"
description = "Local, offline speech-to-text CLI (Whisper) with denoising and optional speaker diarization"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["speech-to-text", "asr", "whisper", "transcription", "offline", "diarization"]

# Core runtime dependency. Everything else (CLI, audio I/O via ffmpeg,
# output writers) uses the standard library. FFmpeg is an external *binary*,
# not a Python package.
dependencies = [
    "faster-whisper>=1.0.0",
]

[project.optional-dependencies]
# Neural denoiser - better than the default ffmpeg filter chain on noisy audio.
denoise = ["deepfilternet>=0.5.6"]
# Neural speech enhancement/restoration (--enhance resemble).
enhance = ["resemble-enhance>=0.0.1"]
# Speaker diarization ("who said what"), pyannote backend. Pulls in torch.
diarize = ["pyannote.audio>=3.1"]
# Speaker diarization, WhisperX backend (--diarize-backend whisperx).
diarize-whisperx = ["whisperx>=3.1"]
# Test suite.
dev = ["pytest>=7.0"]
# Everything.
all = ["deepfilternet>=0.5.6", "resemble-enhance>=0.0.1",
       "pyannote.audio>=3.1", "whisperx>=3.1"]

[project.scripts]
plaude-local = "plaude_local.cli:main"

[tool.setuptools]
packages = ["plaude_local"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
