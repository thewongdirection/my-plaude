name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  python-tests:
    name: Python tests (unittest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The suite is standard-library only and mocks every heavy/network
      # backend, so it needs no dependencies (no faster-whisper, no GPU).
      - name: Run unittest suite
        run: python -m unittest discover -s tests -v

      - name: Byte-compile the package
        run: python -m compileall -q plaude_local

  powershell-tests:
    name: PowerShell tests (Pester)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Ensure Pester 5+
        shell: pwsh
        run: |
          $existing = Get-Module -ListAvailable Pester |
            Where-Object { $_.Version -ge [version]'5.0.0' }
          if (-not $existing) {
            Set-PSRepository PSGallery -InstallationPolicy Trusted
            Install-Module Pester -MinimumVersion 5.5.0 -Force -Scope CurrentUser
          }

      - name: Run Pester tests
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 5.0.0
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = './powershell'
          $cfg.Run.Exit = $true
          $cfg.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $cfg
